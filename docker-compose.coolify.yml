# Book Buddy by VPD - production stack for Coolify.
#
# Coolify resource: "Private Repository (with Deploy Key)" -> build pack
# "Docker Compose" -> compose file /docker-compose.coolify.yml.
#
# Secrets: every SERVICE_USER_* / SERVICE_PASSWORD_* value below is a Coolify
# "magic" variable - Coolify generates it on the first deploy, keeps it, and
# shows it under the resource's Environment Variables. Nothing secret lives in
# this file or in git.
#
# Domains are assigned per service in Coolify:
#   web   -> https://bookbuddy.vinstitution.com:3000
#   api   -> https://api.bookbuddy.vinstitution.com:3333
#   minio -> https://media.bookbuddy.vinstitution.com:9000
# APP_URL / API_URL / MEDIA_URL default to those and can be overridden in
# Coolify's Environment Variables (the web app must be redeployed afterwards,
# because the browser bundle bakes them in at build time).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://bookbuddy.vinstitution.com}
        NEXT_PUBLIC_BACKEND_URL: ${API_URL:-https://api.bookbuddy.vinstitution.com}
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.bookbuddy.vinstitution.com}
        NEXT_PUBLIC_CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}/book-buddy-media
        NEXT_PUBLIC_DRM_KEY: ${SERVICE_PASSWORD_64_DRM}
        NEXT_PUBLIC_FEDERATION_ENABLED: "false"
        NEXT_PUBLIC_SENTRY_DSN: ""
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://bookbuddy.vinstitution.com}
      NEXT_PUBLIC_BACKEND_URL: ${API_URL:-https://api.bookbuddy.vinstitution.com}
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.bookbuddy.vinstitution.com}
      BACKEND_INTERNAL_URL: http://api:3333
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/book_buddy
      BETTER_AUTH_URL: ${APP_URL:-https://bookbuddy.vinstitution.com}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      NEXT_PUBLIC_DRM_KEY: ${SERVICE_PASSWORD_64_DRM}
      S3_ENDPOINT: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}
      CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}/book-buddy-media
      NEXT_PUBLIC_CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}/book-buddy-media
      MEDIA_PROXY_ALLOWED_HOSTS: ${MEDIA_HOST:-media.bookbuddy.vinstitution.com}
      FEDERATION_ENABLED: "false"
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      # Google sign-in: inert until both are set in Coolify (callback: <APP_URL>/api/auth/callback/google).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # One switch for the web app and the API: anyone may create an account. Default closed.
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3333"
      APP_ORIGIN: ${APP_URL:-https://bookbuddy.vinstitution.com}
      FRONTEND_URL: ${APP_URL:-https://bookbuddy.vinstitution.com}
      CORS_ORIGINS: ${APP_URL:-https://bookbuddy.vinstitution.com}
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/book_buddy
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_JWTREFRESH}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OTP_HMAC_SECRET: ${SERVICE_PASSWORD_64_OTP}
      DRM_SECRET_KEY: ${SERVICE_PASSWORD_64_DRM}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@bookbuddy.vinstitution.com}
      # First-run seed (reference data + this super admin). Create-only.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-1}
      SEED_SUPERADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@bookbuddy.vinstitution.com}
      SEED_SUPERADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      SEED_SUPERADMIN_NAME: Super Admin
      # Same switch as the web service: public sign-up (POST /auth/register, first-time Google). Default closed.
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
      S3_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
      S3_BUCKET_NAME: book-buddy-media
      CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.vinstitution.com}/book-buddy-media
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: book_buddy_books_v1
      QDRANT_ALLOW_COLLECTION_CREATE: "true"
      EMBEDDING_DIMENSIONS: "768"
      # AI features stay off until a provider key is added in Coolify.
      LLM_PROVIDER: cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CF_EMBED_MODEL: "@cf/google/embeddinggemma-300m"
      CF_CHAT_MODEL: "@cf/google/gemma-4-26b-a4b-it"
      ENABLE_HYBRID_SEARCH: "false"
      ENABLE_RERANKING: "true"
      ENABLE_QUERY_DECOMPOSITION: "false"
      ENABLE_CHAPTER_VALIDATION: "true"
      DAILY_AI_QUERY_LIMIT: "100"
      VARTA_SOFT_LIMIT_TOKENS: "40000"
      VARTA_HARD_LIMIT_TOKENS: "60000"
      VARTA_MAX_QUERY_TOKENS: "4000"
      AI_CHAT_RETENTION_DAYS: "365"
      # Email is logged, not sent, until RESEND_API_KEY is set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Book Buddy <noreply@bookbuddy.vinstitution.com>}
      WHATSAPP_OTP_TEMPLATE_NAME: book_buddy_otp
      WHATSAPP_API_VERSION: v25.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: book_buddy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
