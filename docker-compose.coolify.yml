# Book Buddy by VPD - production stack for Coolify.
#
# Coolify resource: "Private Repository (with Deploy Key)" -> build pack
# "Docker Compose" -> compose file /docker-compose.coolify.yml.
#
# Secrets: every SERVICE_USER_* / SERVICE_PASSWORD_* value below is a Coolify
# "magic" variable - Coolify generates it on the first deploy, keeps it, and
# shows it under the resource's Environment Variables. Nothing secret lives in
# this file or in git.
#
# Domains are assigned per service in Coolify:
#   web   -> https://bookbuddy.live:3000
#   api   -> https://api.bookbuddy.live:3333
#
# File storage is Cloudflare R2: there is no storage container in this stack.
# Set these in Coolify's Environment Variables. Setup steps: docs/storage-r2.md
# They are written as ${VAR:-} on purpose: Coolify does NOT enforce the "required"
# ${VAR:?message} form, it stores the message text as the value instead. If one is missing
# the app still starts, but file uploads and downloads answer "File storage is not
# configured" and the API log says which setting is wrong.
#   S3_ENDPOINT           https://<account-id>.r2.cloudflarestorage.com   (no bucket name on the end)
#   S3_ACCESS_KEY_ID      R2 API token: Object Read & Write on the bucket
#   S3_SECRET_ACCESS_KEY  the same token's secret
#   S3_BUCKET_NAME        optional, defaults to bookbuddy: the PRIVATE bucket (book files, audio, personal uploads)
#   S3_PUBLIC_BUCKET_NAME optional, defaults to bookbuddymedia: the PUBLIC bucket (covers, samples, branding)
#   MEDIA_URL             public base URL of the PUBLIC bucket's custom domain, with NO bucket
#                         in the path; defaults to https://media.bookbuddy.live
# APP_URL / API_URL / MEDIA_URL default to the values above and can be overridden in
# Coolify's Environment Variables (the web app must be redeployed afterwards,
# because the browser bundle bakes them in at build time).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://bookbuddy.live}
        NEXT_PUBLIC_BACKEND_URL: ${API_URL:-https://api.bookbuddy.live}
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.bookbuddy.live}
        NEXT_PUBLIC_CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.live}
        NEXT_PUBLIC_DRM_KEY: ${SERVICE_PASSWORD_64_DRM}
        NEXT_PUBLIC_FEDERATION_ENABLED: "false"
        NEXT_PUBLIC_SENTRY_DSN: ""
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://bookbuddy.live}
      NEXT_PUBLIC_BACKEND_URL: ${API_URL:-https://api.bookbuddy.live}
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.bookbuddy.live}
      BACKEND_INTERNAL_URL: http://api:3333
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/book_buddy
      BETTER_AUTH_URL: ${APP_URL:-https://bookbuddy.live}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      NEXT_PUBLIC_DRM_KEY: ${SERVICE_PASSWORD_64_DRM}
      # The reader fetches signed R2 links through /api/proxy-media, which only follows hosts it
      # knows: the R2 endpoint (S3_ENDPOINT) and the public media domain.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.live}
      NEXT_PUBLIC_CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.live}
      MEDIA_PROXY_ALLOWED_HOSTS: ${MEDIA_HOST:-media.bookbuddy.live}
      FEDERATION_ENABLED: "false"
      NEXT_PUBLIC_FEDERATION_ENABLED: "false"
      # Google sign-in: inert until both are set in Coolify (callback: <APP_URL>/api/auth/callback/google).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # One switch for the web app and the API: email sign-up (and Google sign-up). Default on; set false in Coolify to close.
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-true}
      # Google may CREATE accounts (existing accounts can always sign in with Google). Default on; set false in Coolify to turn off.
      GOOGLE_SIGNUP_ENABLED: ${GOOGLE_SIGNUP_ENABLED:-true}
      # The platform owner: the only address ever made super-admin, and only after Google verifies it.
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-thevinstitution@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3333"
      APP_ORIGIN: ${APP_URL:-https://bookbuddy.live}
      FRONTEND_URL: ${APP_URL:-https://bookbuddy.live}
      CORS_ORIGINS: ${APP_URL:-https://bookbuddy.live}
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/book_buddy
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_JWTREFRESH}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OTP_HMAC_SECRET: ${SERVICE_PASSWORD_64_OTP}
      DRM_SECRET_KEY: ${SERVICE_PASSWORD_64_DRM}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-thevinstitution@gmail.com}
      # First-run seed (reference data + this super admin). Create-only.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-1}
      SEED_SUPERADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-thevinstitution@gmail.com}
      SEED_SUPERADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      SEED_SUPERADMIN_NAME: Super Admin
      # Same switch as the web service: public sign-up (POST /auth/register, first-time Google). Default on.
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-true}
      # Google may CREATE accounts (existing accounts can always sign in with Google). Default on; set false in Coolify to turn off.
      GOOGLE_SIGNUP_ENABLED: ${GOOGLE_SIGNUP_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Cloudflare R2. Presigned upload/download links are signed for S3_ENDPOINT; CDN_BASE_URL is
      # the public custom domain used only for covers and free samples.
      STORAGE_PROVIDER: r2
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-bookbuddy}
      # Covers, samples and branding go in this second bucket, the only one the public media
      # domain points at. The private bucket above never has a public domain.
      S3_PUBLIC_BUCKET_NAME: ${S3_PUBLIC_BUCKET_NAME:-bookbuddymedia}
      CDN_BASE_URL: ${MEDIA_URL:-https://media.bookbuddy.live}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: book_buddy_books_v1
      QDRANT_ALLOW_COLLECTION_CREATE: "true"
      EMBEDDING_DIMENSIONS: "768"
      # AI features stay off until a provider key is added in Coolify.
      LLM_PROVIDER: cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CF_EMBED_MODEL: "@cf/google/embeddinggemma-300m"
      CF_CHAT_MODEL: "@cf/google/gemma-4-26b-a4b-it"
      ENABLE_HYBRID_SEARCH: "false"
      ENABLE_RERANKING: "true"
      ENABLE_QUERY_DECOMPOSITION: "false"
      ENABLE_CHAPTER_VALIDATION: "true"
      DAILY_AI_QUERY_LIMIT: "100"
      VARTA_SOFT_LIMIT_TOKENS: "40000"
      VARTA_HARD_LIMIT_TOKENS: "60000"
      VARTA_MAX_QUERY_TOKENS: "4000"
      AI_CHAT_RETENTION_DAYS: "365"
      # Email is logged, not sent, until RESEND_API_KEY is set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # The sender stays on the domain already verified with Resend; it does not have to match the
      # app's address. Change it only after verifying the new domain in Resend.
      EMAIL_FROM: ${EMAIL_FROM:-Book Buddy <noreply@bookbuddy.vinstitution.com>}
      WHATSAPP_OTP_TEMPLATE_NAME: book_buddy_otp
      WHATSAPP_API_VERSION: v25.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: book_buddy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
